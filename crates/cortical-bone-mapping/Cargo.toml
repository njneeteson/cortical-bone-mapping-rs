[package]
name = "cortical-bone-mapping"
description = "Cortical bone mapping (Treece et al.) with global, regularised and curvature-penalised model fitting, and model-driven segmentation refinement"
readme = "../../README.md"
documentation = "https://docs.rs/cortical-bone-mapping"
homepage = "https://njneeteson.github.io/cortical-bone-mapping-rs/"
keywords = ["cortical-thickness", "bone", "hr-pqct", "ct", "image-analysis"]
categories = ["science", "computer-vision", "algorithms"]
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
ndarray.workspace = true
rayon.workspace = true
libm.workspace = true
kiddo = { version = "6.3.1", default-features = false, features = ["multi-threaded"] }

[dev-dependencies]
proptest = "1"
